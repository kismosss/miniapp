<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kismo Rewards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #1a1a2e; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .container { max-width: 400px; width: 100%; text-align: center; }
  .balance { background: #16213e; border-radius: 20px; padding: 30px 20px; margin-bottom: 20px; }
  .balance-label { font-size: 14px; color: #888; margin-bottom: 8px; }
  .balance-value { font-size: 48px; font-weight: bold; color: #4ecca3; }
  .balance-value small { font-size: 24px; color: #4ecca3; }
  .btn { background: #4ecca3; color: #1a1a2e; border: none; border-radius: 15px; padding: 18px 30px; font-size: 18px; font-weight: bold; width: 100%; margin-bottom: 15px; cursor: pointer; transition: opacity 0.2s; }
  .btn:active { opacity: 0.8; }
  .btn.secondary { background: #533483; color: #fff; }
  .info { font-size: 13px; color: #888; margin-top: 20px; line-height: 1.6; }
  .loader { display: none; margin: 20px auto; width: 40px; height: 40px; border: 4px solid #333; border-top-color: #4ecca3; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="balance">
    <div class="balance-label">Ваш баланс</div>
    <div class="balance-value" id="balance">0.0000<small>$</small></div>
  </div>

  <button class="btn" id="watchBtn">🎬 Смотреть рекламу (+$0.003)</button>
  <button class="btn secondary" id="withdrawBtn">💸 Вывести</button>

  <div class="loader" id="loader"></div>

  <div class="info">
    Смотри рекламу и получай деньги.<br>
    Вывод от $0.02 через @CryptoBot
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const user = tg.initDataUnsafe?.user;
  const userId = user?.id;

  let balance = 0;

  function updateBalance() {
    document.getElementById('balance').innerHTML = balance.toFixed(4) + '<small>$</small>';
  }

  document.getElementById('watchBtn').addEventListener('click', async () => {
    if (!userId) {
      tg.showAlert('Ошибка: не удалось получить данные пользователя');
      return;
    }

    document.getElementById('loader').style.display = 'block';
    document.getElementById('watchBtn').disabled = true;

    setTimeout(() => {
      balance += 0.003;
      updateBalance();
      document.getElementById('loader').style.display = 'none';
      document.getElementById('watchBtn').disabled = false;
      tg.showAlert('✅ Начислено +$0.003');
    }, 3000);
  });

  document.getElementById('withdrawBtn').addEventListener('click', () => {
    if (balance < 0.02) {
      tg.showAlert('❌ Минимум для вывода: $0.02');
      return;
    }
    tg.showAlert('💸 Заявка отправлена. Жди подтверждения.');
  });

  updateBalance();
</script>
</body>
  </html>
