<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kismo Rewards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #1a1a2e; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .container { max-width: 400px; width: 100%; text-align: center; }
  .balance { background: #16213e; border-radius: 20px; padding: 30px 20px; margin-bottom: 20px; }
  .balance-label { font-size: 14px; color: #888; margin-bottom: 8px; }
  .balance-value { font-size: 48px; font-weight: bold; color: #4ecca3; }
  .balance-value small { font-size: 24px; color: #4ecca3; }
  .btn { background: #4ecca3; color: #1a1a2e; border: none; border-radius: 15px; padding: 18px 30px; font-size: 18px; font-weight: bold; width: 100%; margin-bottom: 15px; cursor: pointer; transition: opacity 0.2s; }
  .btn:active { opacity: 0.8; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary { background: #533483; color: #fff; }
  .info { font-size: 13px; color: #888; margin-top: 20px; line-height: 1.6; }
  .loader { display: none; margin: 20px auto; width: 40px; height: 40px; border: 4px solid #333; border-top-color: #4ecca3; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 14px; color: #4ecca3; margin-top: 10px; min-height: 20px; }
</style>
</head>
<body>
<div class="container">
  <div class="balance">
    <div class="balance-label">Ваш баланс</div>
    <div class="balance-value" id="balance">0.0000<small>$</small></div>
  </div>

  <button class="btn" id="watchBtn">🎬 Смотреть рекламу (+$0.003)</button>
  <button class="btn secondary" id="withdrawBtn">💸 Вывести</button>

  <div class="loader" id="loader"></div>
  <div class="status" id="status"></div>

  <div class="info">
    Смотри рекламу и получай деньги.<br>
    Вывод от $0.02 через @CryptoBot
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const AdController = window.Adsgram?.init({ blockId: "54308" });

  // === БАЛАНС В LOCALSTORAGE ===
  const STORAGE_KEY = "kismo_balance";

  function loadBalance() {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? parseFloat(saved) : 0;
  }

  function saveBalance(value) {
    localStorage.setItem(STORAGE_KEY, value.toFixed(4));
  }

  let balance = loadBalance();

  function updateBalance() {
    document.getElementById('balance').innerHTML = balance.toFixed(4) + '<small>$</small>';
  }

  updateBalance();

  // === КНОПКА "СМОТРЕТЬ РЕКЛАМУ" ===
  document.getElementById('watchBtn').addEventListener('click', async () => {
    const btn = document.getElementById('watchBtn');
    const loader = document.getElementById('loader');
    const status = document.getElementById('status');

    btn.disabled = true;
    loader.style.display = 'block';
    status.textContent = 'Загружаю рекламу...';

    try {
      if (!AdController) {
        throw new Error('AdsGram не загрузился');
      }

      await AdController.show();

      // Начисляем и сохраняем
      balance += 0.003;
      saveBalance(balance);
      updateBalance();
      status.textContent = '✅ Начислено +$0.003';
      tg.showAlert('✅ Начислено +$0.003');
    } catch (e) {
      if (e.done === false) {
        status.textContent = '❌ Реклама не была досмотрена';
        tg.showAlert('❌ Реклама не была досмотрена. Попробуй ещё раз.');
      } else {
        status.textContent = '❌ Ошибка загрузки';
        tg.showAlert('❌ Не удалось загрузить рекламу. Попробуй позже.');
      }
    } finally {
      btn.disabled = false;
      loader.style.display = 'none';
    }
  });

  // === КНОПКА "ВЫВЕСТИ" ===
  document.getElementById('withdrawBtn').addEventListener('click', () => {
    if (balance < 0.02) {
      tg.showAlert('❌ Минимум для вывода: $0.02. У тебя $' + balance.toFixed(4));
      return;
    }
    tg.showAlert('💸 Заявка на вывод отправлена. Сумма: $' + balance.toFixed(4));
    // Пока просто уведомление. Позже сделаем реальный вывод.
  });
</script>
</body>
</html>
